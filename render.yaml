services:
  - type: web
    name: rocky-game-server
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build --workspace @rocky/shared && npm run build --workspace @rocky/server
    startCommand: npm run start --workspace @rocky/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://rocky-the-journey.vercel.app
